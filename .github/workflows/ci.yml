name: CI

# Every push and PR runs the full pipeline. There is no deploy stage: the
# project has no hosting target yet, so a merge to main stops at "everything
# builds, the images start, and the end-to-end smoke test passes against
# them". Add a deploy job gated on `needs: [frontend, engine, stack]` once a
# target exists.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend · lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      AUTH_SECRET: ci-build-only-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint -- --max-warnings=0
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and route tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Audit runtime dependencies (critical)
        run: npm audit --omit=dev --audit-level=critical

  integration:
    name: Frontend · integration tests (Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: resoniq
          POSTGRES_PASSWORD: resoniq
          POSTGRES_DB: resoniq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resoniq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://resoniq:resoniq@localhost:5432/resoniq_test
      DATABASE_URL: postgresql://resoniq:resoniq@localhost:5432/resoniq_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Migration drift check
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "$TEST_DATABASE_URL" --exit-code
      - name: Integration tests
        run: npm run test:int

  engine:
    name: Engine · lint, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-engine
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            python-engine/requirements.txt
            python-engine/requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsndfile1
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest

  stack:
    name: Docker images · compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Write .env for compose
        run: |
          {
            echo "AUTH_SECRET=$(openssl rand -hex 32)"
            echo "RESONIQ_ENGINE_SECRET=$(openssl rand -hex 32)"
          } > .env
      - name: Build images
        run: docker compose build
      - name: Start the stack
        run: docker compose up -d
      - name: Wait for the frontend
        run: |
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000/; then exit 0; fi
            sleep 2
          done
          docker compose ps -a
          docker compose logs
          exit 1
      - name: End-to-end smoke test
        run: BASE_URL=http://localhost:3000 scripts/smoke-test.sh
      - name: Install ffmpeg (generates the e2e test clip)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Platform end-to-end test (social, media worker, permissions)
        run: BASE_URL=http://localhost:3000 scripts/e2e-platform.sh
      - name: Logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
