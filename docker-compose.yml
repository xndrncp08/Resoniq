services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: resoniq
      POSTGRES_PASSWORD: resoniq
      POSTGRES_DB: resoniq
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resoniq"]
      interval: 5s
      timeout: 5s
      retries: 10

  python-engine:
    build: ./python-engine
    restart: unless-stopped
    # Not published: only the frontend container talks to the engine.
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      RESONIQ_ENGINE_SECRET: ${RESONIQ_ENGINE_SECRET:?set RESONIQ_ENGINE_SECRET in .env}
      # Optional: without a key the engine returns its rule-based recipe.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      RESONIQ_CLAUDE_MODEL: ${RESONIQ_CLAUDE_MODEL:-claude-sonnet-5}

  migrate:
    build:
      context: ./frontend
      target: migrate
    environment:
      DATABASE_URL: postgresql://resoniq:resoniq@postgres:5432/resoniq
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://resoniq:resoniq@postgres:5432/resoniq
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      AUTH_TRUST_HOST: "true"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      RESONIQ_LOCAL_STORAGE_DIR: /data/songs
      PYTHON_ENGINE_URL: http://python-engine:8000
      RESONIQ_ENGINE_SECRET: ${RESONIQ_ENGINE_SECRET:?set RESONIQ_ENGINE_SECRET in .env}
    volumes:
      # Used when Supabase isn't configured.
      - song_data:/data/songs
    depends_on:
      migrate:
        condition: service_completed_successfully
      python-engine:
        condition: service_healthy

volumes:
  postgres_data:
  song_data:
